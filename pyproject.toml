[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agenticiot-platform"
version = "0.1.0"
description = "AI-native physical device management and execution platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "jsonschema>=4.26,<5",
  "paho-mqtt>=2.1,<3",
  "pyjwt[crypto]>=2.10,<3",
  "websockets>=15,<18",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "httpx2>=2.12,<3",
  "ruff>=0.11,<1",
  "openapi-spec-validator>=0.7,<0.8",
  "pyyaml>=6,<7",
  "amqtt>=0.11.3,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/agenticiot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["integration: requires a dedicated PostgreSQL database"]
# Starlette 1.6 uses an alias deprecated by AnyIO 4.15; retain errors for all other warnings.
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
